[project]
name = "ai_advanced"
description = "Lecture notes on ai and machine learning with python"
version = "1.0.0"
license = "MIT"
authors = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }
]
maintainers = [
    { name = "Paul-B98", email = "115164840+Paul-B98@users.noreply.github.com" }
]
readme = "README.md"
keywords = ["Lecture", "Notes", "AI", "Machine Learning", "Python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "bertviz>=1.4.1",
    "datasets>=4.8.5",
    "evaluate>=0.4.4",
    "jupyterlab>=4.5.7",
    "lightning>=2.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "optuna>=4.6.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "seqeval>=1.2.2",
    "smolagents[openai]>=1.24.0",
    "tensorboard>=2.19.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers[torch]>=5.8.0",
]

[project.urls]
homepage = "https://github.com/Paul-B98/lecture-ai-advanced"
repository = "https://github.com/Paul-B98/lecture-ai-advanced"
changelog = "https://github.com/Paul-B98/lecture-ai-advanced/releases"
issues = "https://github.com/Paul-B98/lecture-ai-advanced/issues"
documentation = "https://github.com/Paul-B98/lecture-ai-advanced/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.1.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]
cache_dir = "/workspaces/.cache/pytest"
addopts = [
    "--cov",
    "--cov-branch",
    "--cov=src",
    "--cov-report=xml",
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
exclude = [
    "docs/*",
    "tests/*",
]
